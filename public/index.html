<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradeOps Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #0e1117; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .btn-call { background: linear-gradient(to bottom, #26a69a, #208e82); box-shadow: 0 4px 0 #15685e; }
        .btn-call:active { transform: translateY(4px); box-shadow: none; }
        .btn-put { background: linear-gradient(to bottom, #ef5350, #d32f2f); box-shadow: 0 4px 0 #b71c1c; }
        .btn-put:active { transform: translateY(4px); box-shadow: none; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #26a69a; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- Header -->
    <header class="h-14 flex items-center justify-between px-4 bg-[#161b22] border-b border-gray-800 z-20">
        <div class="flex flex-col">
            <span class="text-[10px] text-gray-500 font-bold tracking-widest">ASSET</span>
            <div class="flex items-center gap-1 text-white font-bold text-sm">
                EUR/USD <span class="text-green-400 text-[10px]">82%</span>
            </div>
        </div>
        
        <!-- AUTO BOT TOGGLE -->
        <div class="flex items-center gap-2">
            <label class="switch">
                <input type="checkbox" id="auto-toggle" onchange="toggleAuto()">
                <span class="slider"></span>
            </label>
            <span class="text-[10px] font-bold text-gray-400 uppercase">Auto Pilot</span>
        </div>
        
        <div class="flex flex-col items-end" onclick="confirmReset()">
            <span class="text-[10px] text-gray-500 font-bold tracking-widest">DEMO ACCOUNT</span>
            <div class="text-white font-bold font-mono tracking-tight" id="balance">...</div>
        </div>
    </header>

    <!-- Chart Layer -->
    <div id="chart" class="flex-1 relative w-full h-full cursor-crosshair">
        <!-- Overlay HUD -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 glass px-4 py-1 rounded-full text-xs font-mono font-bold text-white z-10" id="live-price">
            --.----
        </div>
    </div>

    <!-- Active Trade Panel (Slide Up) -->
    <div id="trade-panel" class="hidden absolute bottom-24 left-4 right-4 z-30 transition-all duration-300 space-y-2">
        <!-- Summary -->
        <div class="glass rounded-xl p-3 flex justify-between items-center cursor-pointer" onclick="toggleDetails()">
            <div class="flex flex-col">
                <span class="text-xs text-gray-400 font-bold tracking-widest">OPEN TRADES</span>
                <span class="text-white font-bold text-sm" id="trade-count">0 Positions</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs text-gray-400 font-bold tracking-widest">NET PNL</span>
                <div class="text-xl font-bold font-mono" id="trade-pnl">$0.00</div>
            </div>
        </div>
        
        <!-- Detailed List (Hidden by default) -->
        <div id="trade-list" class="hidden bg-gray-900/90 backdrop-blur rounded-xl p-2 max-h-48 overflow-y-auto border border-gray-700">
            <!-- Rows injected here -->
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="h-20 bg-[#161b22] border-t border-gray-800 p-2 grid grid-cols-3 gap-2 z-20">
        <!-- Amount Input -->
        <div class="bg-gray-800 rounded-lg p-1 flex flex-col justify-center px-3 border border-gray-700">
            <label class="text-[9px] text-gray-500 font-bold uppercase">Amount</label>
            <div class="flex items-center text-white font-bold">
                $<input type="number" id="amount" value="100" class="bg-transparent w-full outline-none" inputmode="numeric">
            </div>
        </div>

        <!-- Buttons -->
        <button onclick="openTrade('PUT')" class="btn-put rounded-lg flex flex-col items-center justify-center text-white font-bold">
            <span class="text-xs">PUT</span>
            <span class="text-[9px] opacity-75">DOWN</span>
        </button>
        <button onclick="openTrade('CALL')" class="btn-call rounded-lg flex flex-col items-center justify-center text-white font-bold">
            <span class="text-xs">CALL</span>
            <span class="text-[9px] opacity-75">UP</span>
        </button>
    </div>

    <script>
        // --- CHART SETUP ---
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#0e1117', textColor: '#8b949e' },
            grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
            timeScale: { timeVisible: true, secondsVisible: true },
            crosshair: { mode: 0 }
        });
        const lineSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
        
        // --- LOGIC ---
        let lastTime = Math.floor(Date.now() / 1000);
        let pollInterval;

        async function sync() {
            try {
                const res = await fetch('/api/tick');
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();
                render(data);
                document.getElementById('live-price').style.borderColor = 'rgba(34,197,94,0.5)'; // Green border on sync
            } catch(e) {
                console.error(e);
                document.getElementById('live-price').style.borderColor = 'rgba(239,68,68,0.5)'; // Red border on fail
                document.getElementById('live-price').innerText = "CONNECTING...";
            }
        }

        function toggleDetails() {
            document.getElementById('trade-list').classList.toggle('hidden');
        }

        function render(data) {
            // Update Price & Balance
            const time = Math.floor(data.timestamp / 1000);
            const price = parseFloat(data.price.toFixed(5));
            lineSeries.update({ time: time, value: price });
            document.getElementById('live-price').innerText = price.toFixed(5);
            document.getElementById('balance').innerText = '$' + data.account.balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('auto-toggle').checked = data.account.autoMode;

            // Handle Multi-Trades
            // Engine guarantees activeTrades array
            const trades = data.account.activeTrades || [];
            const panel = document.getElementById('trade-panel');
            
            if (trades.length > 0) {
                panel.classList.remove('hidden');
                document.getElementById('trade-count').innerText = `${trades.length} Active`;
                
                const netPnL = trades.reduce((sum, t) => sum + t.pnl, 0);
                const pnlEl = document.getElementById('trade-pnl');
                pnlEl.innerText = (netPnL >= 0 ? '+' : '') + '$' + netPnL.toFixed(2);
                pnlEl.className = `text-xl font-bold font-mono ${netPnL >= 0 ? 'text-green-400' : 'text-red-400'}`;

                // Render List
                const list = document.getElementById('trade-list');
                list.innerHTML = trades.map(t => `
                    <div class="flex justify-between items-center py-2 border-b border-gray-700 last:border-0">
                        <div class="flex flex-col">
                            <span class="text-[10px] font-bold ${t.type === 'CALL' ? 'text-green-400' : 'text-red-400'}">${t.type}</span>
                            <span class="text-[10px] text-gray-500">@ ${parseFloat(t.entry).toFixed(5)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-mono font-bold ${t.pnl >= 0 ? 'text-green-400' : 'text-red-400'}">
                                ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}
                            </span>
                            <button onclick="closeTrade('${t.id}')" class="text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-white">X</button>
                        </div>
                    </div>
                `).join('');
            } else {
                panel.classList.add('hidden');
            }
        }

        async function openTrade(type) {
            const amt = document.getElementById('amount').value;
            await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'OPEN', type, amount: amt })
            });
            sync();
        }

        async function closeTrade(id) {
            await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'CLOSE', tradeId: id })
            });
            sync();
        }
        
        async function toggleAuto() {
            await fetch('/api/trade', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: 'TOGGLE_AUTO' })
            });
            sync();
        }

        async function confirmReset() {
            if(confirm("Reset Demo Account Balance?")) {
                await fetch('/api/trade', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ action: 'RESET' })
                });
                sync();
            }
        }

        // Init history loop locally to fill chart fast
        let t = Math.floor(Date.now() / 1000) - 300;
        let p = 1.1000;
        for(let i=0; i<300; i++) {
            t++;
            p += (Math.random() - 0.5) * 0.0005;
            lineSeries.update({ time: t, value: p });
        }

        setInterval(sync, 500);
        sync();
        
        // Auto-resize
        new ResizeObserver(() => {
            chart.resize(document.getElementById('chart').clientWidth, document.getElementById('chart').clientHeight);
        }).observe(document.getElementById('chart'));

    </script>
</body>
</html>
